# Copia questo file in config.toml e modificalo. config.toml non va mai su GitHub.

[general]
workspace = "workspace"   # cartella del "cervello": CLAUDE.md, skill, memoria
data_dir = "data"         # database locale delle conversazioni

[brain]
# "abbonamento" = usa il tuo login di Claude Code (piano Pro): nessun costo extra.
# "api_key"     = usa una chiave API Anthropic (per installazioni in azienda/clienti).
auth = "abbonamento"
api_key = ""
claude_cmd = "claude"
model = "sonnet"          # "sonnet" = veloce; "opus" = più ragionato ma più lento; "" = predefinito
timeout_s = 300
allowed_tools = ["WebSearch", "WebFetch", "Read", "Glob", "Grep", "Write", "Edit", "mcp__notion"]
disallowed_tools = ["Bash", "PowerShell"]

[voice]
enabled = true
hotkey = "ctrl+alt+j"     # premi una volta per parlare, di nuovo per finire
whisper_model = "small"   # tiny/base = più veloce, medium = più preciso
language = "it"
piper_model = "voices/it_IT-paola-medium.onnx"
sample_rate = 16000

[cervello]
# Il cervello condiviso su Google Drive (cartella AGIS): memoria, feedback, brief, richieste.
enabled = true
pull_every_min = 120      # ogni quanto riscaricare memoria, feedback e brief

[connectors]
# I connettori del tuo account claude.ai (claude.ai → Impostazioni → Connettori).
# Claude Code li vede da solo quando il login è con l'abbonamento.
enabled = true
servers = ["Gmail", "Google_Calendar", "Google_Drive", "Notion"]
allow_send = false            # true = AGIS può inviare/rispondere/inoltrare mail (di base: solo bozze)
allow_calendar_edit = false   # true = AGIS può creare e modificare eventi (di base: solo lettura)

[google]
# Caselle Gmail di lavoro/scuola collegate direttamente (guida nel README).
# Ogni account va collegato una volta: python scripts\collega_google.py <email>
accounts = ["a.loffredo@v-media.it", "andrea.loffredo@itsrizzoli.it"]
client_secret = "data/google/client_secret.json"
