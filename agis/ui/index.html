<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>AGIS</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d36; --text:#e6e8eb; --muted:#8b949e;
          --accent:#4fa3ff; --user:#1f3a5f; --danger:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg);
         color:var(--text); font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; letter-spacing:.12em; }
  header #sync { margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word;
         user-select:text; -webkit-user-select:text; cursor:text; }
  .fb, .fb * { user-select:none; -webkit-user-select:none; }
  .user { align-self:flex-end; background:var(--user); }
  .agis { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .typing { opacity:.85; }
  .msg code { background:rgba(255,255,255,.08); padding:1px 5px; border-radius:5px;
              font:13px Consolas, monospace; }
  .msg pre.code { background:rgba(0,0,0,.35); padding:8px 10px; border-radius:8px; margin:6px 0;
                  overflow-x:auto; font:13px/1.4 Consolas, monospace; white-space:pre; }
  .msg strong.h { display:inline-block; margin-top:4px; font-size:15.5px; }
  .msg hr { border:0; border-top:1px solid var(--line); margin:6px 0; }
  .msg a { color:var(--accent); }
  .fb { display:flex; gap:6px; margin-top:6px; }
  .fb button { font-size:13px; padding:2px 8px; }
  #status { padding:4px 16px; color:var(--muted); font-size:12px; min-height:20px; }
  form { display:flex; gap:8px; padding:12px 16px 16px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:44px; padding:10px; border-radius:10px; border:1px solid var(--line);
             background:var(--panel); color:var(--text); font:inherit; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px;
           padding:8px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  #mic.on { background:var(--danger); border-color:var(--danger); }
</style>
</head>
<body>
<header><h1>AGIS</h1><button id="sync" title="Aggiorna memoria, feedback e brief da Drive">⟳</button><button id="new" title="Nuova conversazione">＋ Nuova</button></header>
<div id="log"></div>
<div id="status">Avvio…</div>
<form id="f">
  <button type="button" id="mic" title="Parla (anche con la scorciatoia)">🎙️</button>
  <textarea id="t" placeholder="Scrivi ad AGIS… (Invio per mandare)"></textarea>
  <button type="submit">➤</button>
</form>
<script>
  const log = document.getElementById('log');
  const api = () => window.pywebview && window.pywebview.api;

  function setStatus(s) { document.getElementById('status').textContent = s; }
  function setListening(on) { document.getElementById('mic').classList.toggle('on', on); }

  // Copia negli appunti: prima l'API moderna, se non c'è il metodo classico.
  function copyText(text, btn) {
    const done = () => { btn.textContent = '✔ Copiato'; setTimeout(() => btn.textContent = '📋 Copia', 1500); };
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta);
      ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }

  // Markdown leggero e sicuro: prima si "neutralizza" l'HTML, poi si formatta.
  function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inlineMd(p) {
    let h = esc(p);
    h = h.replace(/^---+\s*$/gm, '<hr>');
    h = h.replace(/^(\s*)[-*] /gm, '$1• ');
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    h = h.replace(/^#{1,6}\s*(.+)$/gm, '<strong class="h">$1</strong>');
    h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    h = h.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
    h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
    h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2">$2</a>');
    return h;
  }
  function renderMd(t) {
    return t.split('```').map((p, i) => i % 2
      ? '<pre class="code">' + esc(p.replace(/^[\w-]*\n/, '')) + '</pre>'
      : inlineMd(p)).join('');
  }
  // I link si aprono nel browser, non dentro la finestra di AGIS.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a');
    if (a) { e.preventDefault(); api().open_url(a.getAttribute('href')); }
  });

  function attachTools(d, id) {
    const fb = document.createElement('div'); fb.className = 'fb';
    const copy = document.createElement('button'); copy.textContent = '📋 Copia';
    copy.onclick = () => copyText(d.querySelector('.body').innerText, copy);
    fb.append(copy);
    if (id !== null && id !== undefined) {
      const up = document.createElement('button'); up.textContent = '👍';
      const down = document.createElement('button'); down.textContent = '👎 correggi';
      const clear = () => { up.remove(); down.remove(); };
      up.onclick = () => { api().feedback(id, 1, ''); clear(); };
      down.onclick = () => {
        const note = prompt('Cosa devo fare diversamente la prossima volta?');
        if (note !== null) { api().feedback(id, -1, note); clear(); }
      };
      fb.append(up, down);
    }
    d.append(fb);
  }

  function bubble(role) {
    const d = document.createElement('div'); d.className = 'msg ' + role;
    const b = document.createElement('div'); b.className = 'body'; d.append(b);
    return d;
  }

  function addMessage(role, text, id) {
    const d = bubble(role);
    const b = d.querySelector('.body');
    if (role === 'agis') { b.innerHTML = renderMd(text); attachTools(d, id); }
    else b.textContent = text;
    log.append(d); log.scrollTop = log.scrollHeight;
  }

  // Risposta in arrivo: il testo compare (già formattato) mentre AGIS lo scrive.
  let live = null, liveRaw = '';
  function startAgis() {
    live = bubble('agis'); live.classList.add('typing');
    live.querySelector('.body').textContent = '…';
    liveRaw = '';
    log.append(live); log.scrollTop = log.scrollHeight;
  }
  function appendAgis(chunk) {
    if (!live) startAgis();
    liveRaw += chunk;
    if (liveRaw.trim()) live.querySelector('.body').innerHTML = renderMd(liveRaw);
    log.scrollTop = log.scrollHeight;
  }
  function finishAgis(text, id) {
    if (!live) startAgis();
    live.classList.remove('typing');
    live.querySelector('.body').innerHTML = renderMd(text);   // testo finale pulito
    attachTools(live, id);
    live = null; liveRaw = '';
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    const t = document.getElementById('t'); const v = t.value.trim();
    if (!v) return;
    if (!api()) { setStatus('AGIS si sta ancora avviando, riprova tra qualche secondo'); return; }
    addMessage('user', v, null); t.value = ''; api().send(v);
  };
  document.getElementById('t').onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); }
  };
  document.getElementById('mic').onclick = () => api() && api().toggle_listening();
  document.getElementById('sync').onclick = () => api() && api().sync_notion();
  document.getElementById('new').onclick = () => { log.innerHTML = ''; api() && api().new_session(); };
  window.addEventListener('pywebviewready', () => setStatus('Pronto'));
</script>
</body>
</html>
