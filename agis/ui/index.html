<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>AGIS</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d36; --text:#e6e8eb; --muted:#8b949e;
          --accent:#4fa3ff; --user:#1f3a5f; --danger:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg);
         color:var(--text); font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; letter-spacing:.12em; }
  header #sync { margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); }
  .agis { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .typing { opacity:.85; }
  .fb { display:flex; gap:6px; margin-top:6px; }
  .fb button { font-size:13px; padding:2px 8px; }
  #status { padding:4px 16px; color:var(--muted); font-size:12px; min-height:20px; }
  form { display:flex; gap:8px; padding:12px 16px 16px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:44px; padding:10px; border-radius:10px; border:1px solid var(--line);
             background:var(--panel); color:var(--text); font:inherit; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px;
           padding:8px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  #mic.on { background:var(--danger); border-color:var(--danger); }
</style>
</head>
<body>
<header><h1>AGIS</h1><button id="sync" title="Aggiorna memoria, feedback e brief da Notion">⟳</button><button id="new" title="Nuova conversazione">＋ Nuova</button></header>
<div id="log"></div>
<div id="status">Avvio…</div>
<form id="f">
  <button type="button" id="mic" title="Parla (anche con la scorciatoia)">🎙️</button>
  <textarea id="t" placeholder="Scrivi ad AGIS… (Invio per mandare)"></textarea>
  <button type="submit">➤</button>
</form>
<script>
  const log = document.getElementById('log');
  const api = () => window.pywebview && window.pywebview.api;

  function setStatus(s) { document.getElementById('status').textContent = s; }
  function setListening(on) { document.getElementById('mic').classList.toggle('on', on); }

  function attachFeedback(d, id) {
    const fb = document.createElement('div'); fb.className = 'fb';
    const up = document.createElement('button'); up.textContent = '👍';
    const down = document.createElement('button'); down.textContent = '👎 correggi';
    up.onclick = () => { api().feedback(id, 1, ''); fb.remove(); };
    down.onclick = () => {
      const note = prompt('Cosa devo fare diversamente la prossima volta?');
      if (note !== null) { api().feedback(id, -1, note); fb.remove(); }
    };
    fb.append(up, down); d.append(fb);
  }

  function addMessage(role, text, id) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    if (role === 'agis' && id !== null) attachFeedback(d, id);
    log.append(d); log.scrollTop = log.scrollHeight;
  }

  // Risposta in arrivo: il testo compare mentre AGIS lo scrive.
  let live = null;
  function startAgis() {
    live = document.createElement('div');
    live.className = 'msg agis typing';
    live.textContent = '…';
    live.dataset.empty = '1';
    log.append(live); log.scrollTop = log.scrollHeight;
  }
  function appendAgis(chunk) {
    if (!live) startAgis();
    if (live.dataset.empty) { live.textContent = ''; delete live.dataset.empty; }
    live.textContent += chunk;
    log.scrollTop = log.scrollHeight;
  }
  function finishAgis(text, id) {
    if (!live) startAgis();
    live.classList.remove('typing');
    live.textContent = text;          // testo finale pulito
    attachFeedback(live, id);
    live = null;
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    const t = document.getElementById('t'); const v = t.value.trim();
    if (!v) return;
    if (!api()) { setStatus('AGIS si sta ancora avviando, riprova tra qualche secondo'); return; }
    addMessage('user', v, null); t.value = ''; api().send(v);
  };
  document.getElementById('t').onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); }
  };
  document.getElementById('mic').onclick = () => api() && api().toggle_listening();
  document.getElementById('sync').onclick = () => api() && api().sync_notion();
  document.getElementById('new').onclick = () => { log.innerHTML = ''; api() && api().new_session(); };
  window.addEventListener('pywebviewready', () => setStatus('Pronto'));
</script>
</body>
</html>
